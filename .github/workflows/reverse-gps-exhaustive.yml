name: reverse-gps-exhaustive

on:
  push:
    branches:
      - agent/reverse-gps-exhaustive
  pull_request:
    branches:
      - agent/wealth-poetry-solver
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast secp256k1 backend
        run: python -m pip install --disable-pip-version-check coincurve==21.0.0
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch puzzle data
        run: python solver.py fetch
      - name: Cross-check fast crypto backend
        run: python reverse_gps_exhaustive.py verify

  exhaustive:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast secp256k1 backend
        run: python -m pip install --disable-pip-version-check coincurve==21.0.0
      - name: Fetch puzzle data
        run: python solver.py fetch
      - name: Exhaustive reverse-GPS shard
        run: >-
          python reverse_gps_exhaustive.py scan
          --shard-index ${{ matrix.shard }}
          --shard-count 8
          --report data/reverse-exhaustive-shard-${{ matrix.shard }}.json
      - name: Upload shard report
        uses: actions/upload-artifact@v4
        with:
          name: reverse-exhaustive-shard-${{ matrix.shard }}
          path: data/reverse-exhaustive-shard-${{ matrix.shard }}.json

  aggregate:
    needs: exhaustive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast secp256k1 backend
        run: python -m pip install --disable-pip-version-check coincurve==21.0.0
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: reverse-exhaustive-shard-*
          path: data/shards
          merge-multiple: true
      - name: Aggregate exhaustive report
        run: >-
          python reverse_gps_exhaustive.py aggregate
          data/shards/reverse-exhaustive-shard-*.json
          --output data/reverse-gps-exhaustive-report.json
      - name: Upload exhaustive report
        uses: actions/upload-artifact@v4
        with:
          name: reverse-gps-exhaustive-report
          path: data/reverse-gps-exhaustive-report.json
